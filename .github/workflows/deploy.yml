name: Deploy Racely

on:
  push:
    branches:
      - main

concurrency:
  group: racely-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          RACELY_SSH_KEY_B64: ${{ secrets.RACELY_SSH_KEY_B64 }}
        run: |
          echo "$RACELY_SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/racely_ec2"
          chmod 600 "$RUNNER_TEMP/racely_ec2"

          ssh-keygen -y -f "$RUNNER_TEMP/racely_ec2" > /dev/null

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RACELY_HOST }}
          username: ${{ secrets.RACELY_USER }}
          key_path: ${{ runner.temp }}/racely_ec2
          script: |
            /usr/local/bin/deploy-racely
